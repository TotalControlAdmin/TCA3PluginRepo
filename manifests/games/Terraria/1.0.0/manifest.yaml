shortDescription: "Vanilla Terraria dedicated server (Windows / Linux) installed and updated from terraria.org, with console, graceful save-and-stop, world settings editor and backups"
longDescription: |
  # Terraria
  
  ## Description
  Vanilla Terraria dedicated server for Windows and Linux, downloaded from terraria.org (no Steam account needed).
  
  ## Key Features
  - **Install and update from terraria.org:** the newest official server is downloaded on install, and an **Update Terraria** button (also available as a scheduled task) installs a newer release, keeping worlds and settings. The server is stopped for the update and started again.
  - **Starts out of the box:** the world is created on the first start with the size, difficulty and seed from the config editor. On Windows the start script installs the Microsoft XNA Framework 4.0 the server needs when the host does not have it.
  - **Console** in the Terminal on both systems, with Terraria's console commands (`say`, `save`, `playing`, `kick`, `ban`, `password`, `motd` ...).
  - **Graceful stop** with `exit`, which saves the world.
  - **Status:** the server shows online while its game port is open (vanilla Terraria has no server-browser query).
  - **Config editor** for `serverconfig.txt`: password, message of the day, anti-cheat, world name, and size, difficulty and seed for new worlds.
  - **Backups** of the worlds, `serverconfig.txt` and the ban list. The server is stopped first.
  
  ## Ports
  - Game 7777 (TCP).
  
  ## Instructions
  - Worlds are in the `worlds` folder. To switch worlds, change the world name; a missing world is created on the next start.
  - Player counts are not shown: vanilla Terraria cannot be queried without joining it.
  
