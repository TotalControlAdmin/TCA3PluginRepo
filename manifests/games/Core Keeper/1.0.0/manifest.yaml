shortDescription: "Core Keeper dedicated server (Linux) with a managed virtual display, direct connections, graceful save-and-stop, world settings and backups"
longDescription: |
  # Core Keeper
  
  ## Description
  Core Keeper dedicated server for Linux (Steam app 1963720, anonymous download). On Windows the server cannot be stopped without losing the world, so only Linux is provided.
  
  ## Key Features
  - **Steam update** on install and from the panel.
  - **Starts out of the box:** the server needs an X display even in batch mode; a start script gives each service its own virtual display (Xvfb) and installs `xvfb` and `libxi6` when the host does not have them (apt on Debian/Ubuntu, dnf/yum on Red Hat based systems). A stop script removes the display again.
  - **Direct connections** on the game port (cross-play), next to the Steam Game ID.
  - **Graceful stop:** a stop script sends SIGTERM, so the server saves the world and the settings before it exits.
  - **Console output** from the server log (`CoreKeeperServerLog.txt`).
  - **Status:** the server shows online while its port is open (Core Keeper has no server-browser query).
  - **Command-line settings:** world name, world slot, world mode and seed for new worlds, a fixed Game ID and the direct-connect password.
  - **Backups** of the `data` folder (worlds, settings, admins, bans). The server is stopped first.
  
  ## Ports
  - Game 27015 (UDP).
  
  ## Instructions
  - Players join with the Steam Game ID, or by IP, port and password. Both are in `GameInfo.txt` (Log Files).
  - Leave the Game ID and password empty to keep the ones the server generated; they are stored in `data/ServerConfig.json`.
  - Admins and bans: `data/Admins.json` and `data/PlayerBans.json`.
  
