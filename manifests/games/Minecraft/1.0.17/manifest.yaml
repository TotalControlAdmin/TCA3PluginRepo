longDescription: |
  # Minecraft (MC)
  
  **Minecraft (MC)** is a 3D sandbox adventure game developed by Mojang Studios where players can interact with a fully customizable three-dimensional world made of blocks and entities. Its diverse gameplay options allow players to choose the way they play, creating countless possibilities.
  
  ## Key Features
  - **Minecraft modpacks**
  - **Command line manager**
  - **"Use modloader" command-line option:** tick it and pick the Forge / NeoForge `unix_args.txt` / `win_args.txt` file to launch the server through it, keeping the memory and JVM settings.
  
  ## What's new in 1.0.17
  - New "Use modloader" option on the custom command line (the `UseModloader` checkbox and the `ModloaderArgs` file picker). The `Jar` field is hidden while it is ticked.
  - Installing Forge or NeoForge from the mods page now ticks "Use modloader" and selects the installed arguments file, so the line stays editable in the Command Lines form. Uninstalling handles both kinds of line.
  - Java detection: choosing a fixed Java version now also updates the launcher, so a "Java 25" choice no longer starts the server with an older Java. Windows paths in the modloader arguments are handled.
  - Databases permission for the default roles.
