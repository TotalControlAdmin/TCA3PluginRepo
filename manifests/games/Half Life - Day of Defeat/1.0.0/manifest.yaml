shortDescription: "Day of Defeat (HLDS) dedicated server (Windows / Linux) with Steam update, console and graceful stop"
longDescription: |
  # Half Life - Day of Defeat
  
  ## Description
  Day of Defeat (GoldSrc) dedicated server for Windows and Linux (HLDS, Steam app 90, anonymous download).
  
  ## Key Features
  - **Windows and Linux** configs (`hlds.exe` / `hlds_run`).
  - **Steam update** on install and from the panel.
  - **Server-browser query** (A2S).
  - **Console:** Terminal on Linux, the console wrapper on Windows. Console commands work on both.
  - **Graceful stop** with `quit`. The command line includes `-norestart`, so `hlds_run` doesn't relaunch the server on stop.
  - **Config editor** for `dod/server.cfg`, `dod/mapcycle.txt` and `dod/motd.txt`.
  - On Linux a start script writes `steam_appid.txt` (30), so a new server can reach Steam on its first start.
  - **Backups** with the panel's backup feature: the configs and text files in `dod` (server.cfg, map cycle, MOTD, bans) and `dod/addons` (AMX Mod X / Metamod).
  
  ## Ports
  - Game, query and RCON share one port (default 27016).
  
  ## Instructions
  - On Linux, `hlds_linux` exits with code 139 when it quits. That's a long-standing GoldSrc quirk, not a crash on stop.
