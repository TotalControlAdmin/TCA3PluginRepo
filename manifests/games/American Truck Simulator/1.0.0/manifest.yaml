version: "1.0.0"
minimumApplicationVersion: "3.23"
author: "TCAdmin"
shortDescription: "American Truck Simulator dedicated server (Windows / Linux) with A2S query, console, graceful stop, session config editor and backups; starts out of the box"
longDescription: |
  # American Truck Simulator
  
  ## Description
  American Truck Simulator (Convoy) dedicated server for Windows and Linux (Steam app 2239530, anonymous download). Game ownership is not needed to run it.
  
  ## Key Features
  - **Windows and Linux** configs on the native dedicated server.
  - **Steam update** on install and from the panel.
  - **Server-browser query** (A2S on the query port). The session name comes from the service name.
  - **Console** output in the Terminal on both systems.
  - **Graceful stop** with Ctrl+C.
  - **Config editor** for `server_config.sii`: session name, password, description, welcome message, logon token, player damage, traffic, name tags, speed limiter, collisions, time zones and AI vehicle limits.
  - **Starts out of the box:** a start script writes default `server_packages.sii` / `server_packages.dat` files (base map) when there are none. On Linux it also puts `steamclient.so` where the Steam API looks for it, and installs the `libatomic` library the server needs when the host does not have it (apt on Debian/Ubuntu, dnf/yum on Red Hat based systems).
  - **Backups** of the session config, the server packages and the `mod` folder.
  
  ## Ports
  - Query 27016 (UDP): the A2S server-browser query. It follows the game port (+1).
  - Game 27015: announced to Steam. The server opened no socket on it in testing.
  - The server has no bind-address setting and listens on all addresses (0.0.0.0), so the game keeps every service on the server's primary IP.
  - It also opens one UDP port with a random number (Steam networking) and a TCP port on 127.0.0.1 (local Steam connection). Neither can be set.
  - Port changes in the service settings are written to `server_config.sii` on the next start.
  
  ## Instructions
  - The server's home folder is `American Truck Simulator` in the service folder. Logs: `server.log.txt` there.
  - For DLC maps or mods, run `export_server_packages` in the game's console (with a map loaded) and upload the generated `server_packages.sii` and `server_packages.dat` to the home folder, replacing the defaults.
  - Without a logon token the server gets a new server id on each start. Create a token for the **game** app id (270880) at steamcommunity.com/dev/managegameservers and enter it in the config editor.
  - Moderators: add `moderator_list` entries (Steam ids) to `server_config.sii` in the file manager.
  
