shortDescription: "Team Fortress 2 dedicated server (Windows / Linux) with Steam update, console and graceful stop"
longDescription: |
  # Team Fortress 2
  
  ## Description
  Team Fortress 2 dedicated server for Windows and Linux (Steam app 232250, anonymous download).
  
  ## Key Features
  - **Windows and Linux** configs (`srcds.exe` / `srcds_run`).
  - **Steam update** on install and from the panel.
  - **Server-browser query** (A2S).
  - **Console:** Terminal on Linux, the console wrapper on Windows. Console commands work on both.
  - **Graceful stop** with `quit`.
  - **Config editor** for `tf/cfg/server.cfg` (hostname, passwords, RCON password).
  
  ## Ports
  - Game, query and RCON share one port (default 27015).
