shortDescription: "SCP: Secret Laboratory dedicated server (Windows / Linux) on LocalAdmin, with A2S query, console, graceful stop, config editor and backups; starts out of the box"
longDescription: |
  # SCP: Secret Laboratory
  
  ## Description
  SCP: Secret Laboratory dedicated server for Windows and Linux (Steam app 996560, anonymous download), run through Northwood's LocalAdmin.
  
  ## Key Features
  - **Windows and Linux** configs on LocalAdmin, which restarts the game after a crash and logs every session.
  - **Steam update** on install and from the panel.
  - **Server-browser query** (A2S on the game port).
  - **Console** in the Terminal with LocalAdmin and game commands (`help`, `players`, `roundrestart`, `ban`, ...).
  - **Graceful stop** with `exit`.
  - **Starts out of the box:** the EULA is accepted on the command line, LocalAdmin's first-run wizard is skipped with a ready configuration, and `hoster_policy.txt` keeps every server config in the service folder (`AppData/config/<port>`) instead of the user profile. On Linux a start script makes the server binaries executable.
  - **Config editor** for `config_gameplay.txt`: server name, contact e-mail, server info Pastebin id and whitelist mode. `config_remoteadmin.txt` (admin roles and members) is listed as a config file too.
  - **Backups** of all server configs (bans, whitelist, reserved slots, admins and settings).
  - **Log viewer** for the LocalAdmin and round logs.
  
  ## Ports
  - Game and query 7777 (UDP).
  
  ## Instructions
  - To be listed publicly, set the contact e-mail and follow Northwood's verification steps (see the console after the first start).
  - Add yourself as owner in `config_remoteadmin.txt` (members section) with your Steam id, e.g. `- 76561198000000000@steam: owner`.
  - The configs are kept per port. If the service's port changes, the next start creates new default configs for the new port.
  
