shortDescription: "Unturned dedicated server (Windows / Linux) with Steam update, console and graceful stop"
longDescription: |
  # Unturned
  
  ## Description
  Unturned dedicated server for Windows and Linux (Steam app 1110390, anonymous download).
  
  ## Key Features
  - **Windows and Linux** configs (`Unturned.exe` / `Unturned_Headless.x86_64`).
  - **Steam update** on install and from the panel.
  - **Server-browser query** (A2S).
  - **Console:** Terminal on Linux, the console wrapper on Windows. Console commands work on both.
  - **Graceful stop** with `shutdown`.
  - **Config editor** for the server's `Config.json`, `Commands.dat` and Workshop config.
  
  ## Ports
  - Windows default 29000, Linux default 27015 (game and query share the port).
  
  ## Instructions
  - Without a Steam Game Server Login Token (GSLT) the server isn't listed in the internet server list. Add one to `Commands.dat` if needed.
