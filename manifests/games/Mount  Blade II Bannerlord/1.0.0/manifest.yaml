author: "TCAdmin"
shortDescription: "Mount & Blade II: Bannerlord dedicated custom server (Windows + native Linux) with a settings form, server token check, .NET 6 runtime setup on Linux, extra modules and a web panel link"
longDescription: |
  ## Description
  
  Mount & Blade II: Bannerlord dedicated custom server for Windows and Linux (native Linux build, no Wine).
  
  ## Key Features
  
  - Server settings in a form: name, password, admin password, game mode, map and team cultures.
  - Command Lines manager: server token, tick rate and extra modules.
  - Linux: the start script installs the .NET 6 runtime the server needs into the service folder, and works around a crash on hosts with glibc 2.38 or newer (Ubuntu 24.04, Debian 13).
  - The start is refused with a clear message while no server token is set.
  - Web panel link (the server's own admin panel).
  - Backups of the server settings.
  
  ## Ports
  
  - Game port (default 7210): UDP for the game, TCP for the web panel and map downloads.
  
  ## Instructions
  
  1. Get a server token: start the game, open Multiplayer, press Alt + ~ and type `customserver.gettoken`. The token is saved to `Documents\Mount and Blade II Bannerlord\Tokens\DedicatedCustomServerAuthToken.txt`.
  2. Paste the contents of that file in Command Lines > Server token. A token is valid for 3 months.
  3. Set the server name, mode and map in Configuration Files, then start the server.
  4. Modules: upload the module folder to `Modules` and add its folder name to Command Lines > Extra modules. Players need the same modules.
  
  The server token is required: without a valid token the server shuts down about 25 seconds after it starts. This config was tested up to the lobby login (install, .NET runtime setup, settings, extra modules, backups). Everything after a successful login was not tested: the online status, console commands, the web panel and players joining.
  
