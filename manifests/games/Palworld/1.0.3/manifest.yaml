longDescription: |
  # Palworld
  
  ## Key Features
  - Graceful shutdown
  - Backup/restore
  - Web console with input
  
  ## What's New
  - Fixed two server settings whose allowed range didn't include the game's default, so the settings page refused to save:
    - Max base camps (server-wide): now 1-500 (default 128)
    - Auto-reset time for guilds with no online players: now 1-720 hours (default 72)
