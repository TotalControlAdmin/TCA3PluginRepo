longDescription: |
  # Rust
  
  **Rust** is a multiplayer survival game where players gather resources, build bases and fight to survive against the environment and each other.
  
  ## Key Features
  - **Rust RCON page:** a live server console with quick commands, the online and banned players (kick, ban, unban) and the server chat, using the panel's built-in Rust WebRcon client.
  - **Wipe Server:** wipe the map, players and blueprints, pick a new seed (optionally from a seed list) and run a Steam update first. It can also run as a scheduled task.
  - **uMod (Oxide)** updated automatically after a Steam update.
  - Startup on an idle priority and random cores until the server is up (Windows and Linux).
  
  ## What's new in 1.0.3
  - New built-in RCON client: the "Rust RCON" page (console, players, bans and chat) replaces the external "Rcon Login" link to the Facepunch WebRcon site.
  - Wipe Server can run as a scheduled task, has an icon, and stops the server itself only once the wipe is confirmed.
  - Move logfile never overwrites an earlier archived log.
  - The startup random-core mask is saved reliably.
