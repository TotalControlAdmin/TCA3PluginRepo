identifier: "Community.ThemeBundles.VIRIDIAN"
name: "VIRIDIAN — Marquee"
version: "1.0.2"
minimumApplicationVersion: "3.16"
author: "TCAdmin"
shortDescription: "Jade poster theme that rebuilds the service home page"
longDescription: |
  # VIRIDIAN — Marquee
  
  ## Description
  VIRIDIAN replaces the service home page end to end.
  
  ## Key Features
  
  ### ⭐ A completely different service home page
  
  - Server name in condensed marquee caps, a live status orb, and one prominent **Join** action wired to the blueprint's connect URL. It goes dead automatically when the server stops, with no page reload.
  - **Segmented slot bar** showing player occupancy at a glance.
  - **Vertical vitals tubes** for CPU, memory and disk that shade toward danger as load climbs.
  - **The header becomes a hardware bezel** on every other service page 
  
  ## What's new
    - Fixed double scrollbar on dropdown lists
    - Detach link is red
  
  ## Instructions
  
  After installing, select the theme and enable **Trusted template**.
    This is required — the theme uses custom properties, `@keyframes`, `@media` and `@import`ed web fonts, all of which the sandboxed CSS sanitizer strips.
    Without it fonts fall back, the status-cooling lever stops working, and the gauges lose their sweep.
  
