longDescription: |
  # Minecraft (MC)
  
  **Minecraft (MC)** is a 3D sandbox adventure game developed by Mojang Studios where players can interact with a fully customizable three-dimensional world made of blocks and entities. Its diverse gameplay options allow players to choose the way they play, creating countless possibilities.
  
  ## Key Features
  - **Minecraft modpacks**
  - **Command line manager**
  - **"Use modloader" command-line option:** tick it and pick the Forge / NeoForge `unix_args.txt` / `win_args.txt` file to launch the server through it, keeping the memory and JVM settings.
  
  ## What's new in 1.0.18
  - Game Mode: the list values are now the names the server writes (`survival`, `creative`, `adventure`, `spectator`), so the configuration editor shows the current game mode instead of a raw value.
  - Level Type: the list values now match what the server writes to `server.properties`, so the selected type is still shown after the first start.
  - Download/Update Java: a Java version that fails to download or extract is logged as a warning and the remaining versions are still installed. Before, one bad download left the service without any Java.
  - Refreshed mod and game update lists.
  
